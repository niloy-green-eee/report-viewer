      '</div><div class="hd hd2 f-orange">Loop Status</div><div class="val">' + esc(r.loop) + "</div></div></div>") + PO_FOOT + "</div></article>";
  }

  function renderPoWise(d, params) {
    var pos = poList(d), years = poYears(d);
    if (!pos.length || !years.length) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no PO attainment rows.</p></div>'; return; }
    var po = pos.indexOf(params.po) >= 0 ? params.po : pos[0];
    var year = params.year === "All" ? "All" : (years.indexOf(+params.year) >= 0 ? +params.year : poDefaultYear(d, years));
    var batches = poBatches(d, year);
    var batch = batches.indexOf(+params.batch) >= 0 ? +params.batch : batches[0];
    var opt = function (v) { return { value: v, label: v }; };
    $("toolbar").innerHTML = selectField("selPo", "PO", pos.map(opt), po) +
      selectField("selYear", "Graduating year", [{ value: "All", label: "Any" }].concat(years.map(opt)), year) +
      selectField("selBatch", "Batch", batches.map(opt), batch) + PRINT_BTNS;
    $("selPo").onchange = function () { go("po-wise", { po: this.value, year: year, batch: batch }); };
    $("selYear").onchange = function () { go("po-wise", { po: po, year: this.value, batch: batch }); };
    $("selBatch").onchange = function () { go("po-wise", { po: po, year: year, batch: this.value }); };
    $("stage").innerHTML = poWiseHtml(computePoWise(d, po, year, batch));
    wirePrint("PO Loop Report - " + po + " - " + (year === "All" ? "Any year" : year) + " - Batch " + batch, "16mm 17.8mm 12mm");
  }

  /* ---------- Batch-wise Report ---------- */
  function computeBatchWise(d, chosen) {
    var pos = poList(d), misses = [];
    var groups = poBatches(d, "All").filter(function (b) { return !chosen || chosen.indexOf(b) >= 0; })
      .map(function (b) { return { label: String(b), batch: b }; });
    groups.forEach(function (g) {
      var ids = {}, got = 0, counted = 0;
      g.student = poThreshold(d, g.batch, false); g.threshold = poThreshold(d, g.batch, true);
      g.values = pos.map(function (p) {
        var rows = d.sheets[p].rows.filter(function (r) { return r[1] === g.batch; });      // every graduate of the batch
        rows.forEach(function (r) { ids[r[2]] = true; });
        return cohortShare(d, rows);
      });
      g.values.forEach(function (v, i) {
        if (v == null) return;
        counted++;
        if (g.threshold == null || v * 100 >= g.threshold) got++; else misses.push(pos[i] + " of Batch " + g.batch);
      });
      g.size = Object.keys(ids).length;
      g.attained = got + " out of " + counted;
    });
    var auto = !groups.length ? "No batch selected." : !misses.length ? "All the batches have attained all the " + pos.length + " POs."
      : "Except for " + misses.join(", ").replace(/, ([^,]*)$/, " and $1") + ", all the batches have attained all the " + pos.length + " POs.";
    return { pos: pos, groups: groups, comment: (d.comments && d.comments.all) || auto };
  }

  function batchWiseHtml(r) {
    var one = function (v) { return v == null ? "" : (Math.round(v * 1000 + 1e-7) / 10).toFixed(1) + "%"; };
    var rows = r.groups.map(function (g) {
      return "<tr><td>" + esc(g.label) + "</td><td>" + g.size + "</td><td>" + g.student + "% / " + g.threshold + "%</td>" +
        g.values.map(function (v) { return "<td" + (v != null && g.threshold != null && v * 100 < g.threshold ? ' class="n"' : "") + ">" + one(v) + "</td>"; }).join("") + "<td>" + esc(g.attained) + "</td></tr>";
    }).join("");
    var cols = r.groups.length >= 3 ? 3 : Math.max(r.groups.length, 1);
    return '<article class="paper co po">' + poLetterhead("PO Attainment Summary Report (Batch)") +
      '<table class="grid tight" style="margin-top:4.6mm"><colgroup><col style="width:7%"><col style="width:6.4%"><col style="width:10.6%"><col span="' + r.pos.length + '"><col style="width:10.4%"></colgroup>' +
      '<thead><tr class="f-yellow"><th>Cohort Batch</th><th>Cohort Size</th><th>Threshold<br>(Student / Cohort)</th>' + r.pos.map(function (p) { return "<th>" + p + "</th>"; }).join("") + "<th>Number of Attained POs</th></tr></thead><tbody>" + rows + "</tbody></table>" +
      '<div class="comment"><b>Comments:</b><div class="pre">' + esc(r.comment) + "</div></div>" +
      '<div class="radars c' + cols + '">' + r.groups.map(function (g) {
        return '<div class="radar">' + radar("Batch " + g.label, [{ values: g.values, color: "#ff0000" }], g.threshold == null ? null : g.threshold / 100, 56) + "</div>"; }).join("") + "</div>" +
      PO_FOOT + "</article>";
  }

  function renderBatchWise(d, params) {
    if (!poYears(d).length) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no PO attainment rows.</p></div>'; return; }
    var all = poBatches(d, "All"), chosen = all.slice();
    if (params.batches != null) chosen = params.batches === "none" ? [] : params.batches.split(",").map(Number).filter(function (b) { return all.indexOf(b) >= 0; });
    var summary = function () { return chosen.length === all.length ? "All (" + all.length + ")" : chosen.length ? chosen.join(", ") : "None"; };
    $("toolbar").innerHTML = '<div class="field"><label>Batches</label><details class="pick"><summary id="pickSum">' + esc(summary()) + "</summary>" +
      '<div class="pickbox"><div class="pickbtns"><button type="button" class="linkbtn" id="pickAll">Select all</button><button type="button" class="linkbtn" id="pickNone">Clear</button></div>' +
      all.map(function (b) { return '<label><input type="checkbox" value="' + b + '"' + (chosen.indexOf(b) >= 0 ? " checked" : "") + "> " + b + "</label>"; }).join("") +
      "</div></details></div>" + PRINT_BTNS;
    var boxes = [].slice.call(document.querySelectorAll(".pickbox input"));
    var draw = function () {
      chosen = boxes.filter(function (x) { return x.checked; }).map(function (x) { return +x.value; });
      $("pickSum").textContent = summary();
      var q = chosen.length === all.length ? "" : "?batches=" + (chosen.length ? chosen.join(",") : "none");
      history.replaceState(null, "", "#/batch-wise" + q);     // keeps the choice in the address without redrawing the menu
      $("stage").innerHTML = batchWiseHtml(computeBatchWise(d, chosen));
      fit();
    };
    boxes.forEach(function (x) { x.onchange = draw; });
    $("pickAll").onclick = function () { boxes.forEach(function (x) { x.checked = true; }); draw(); };
    $("pickNone").onclick = function () { boxes.forEach(function (x) { x.checked = false; }); draw(); };
    document.addEventListener("click", function close(e) {      // a click outside closes the list
      var p = document.querySelector(".pick");
      if (!p) return document.removeEventListener("click", close);
      if (!p.contains(e.target)) p.open = false;
    });
    $("stage").innerHTML = batchWiseHtml(computeBatchWise(d, chosen));
    wirePrint("PO Attainment Summary Report (Batch)", "16mm 17.8mm 12mm");
  }

  /* ---------- Student-wise Report ---------- */
  function poStudents(d, year, batch) {
    var seen = {}, out = [];
    poList(d).forEach(function (p) { d.sheets[p].rows.forEach(function (r) {
      if (r[0] === year && (batch === "All" || r[1] === batch) && !seen[r[2]]) { seen[r[2]] = true; out.push({ id: r[2], name: r[3] }); } }); });
    return out.sort(function (a, b) { return a.id - b.id; });
  }

  function computeStudent(d, id) {
    var pos = poList(d), info = null, courseOrder = [], courseSeen = {};
    var items = pos.map(function (p) {
      var sheet = d.sheets[p], row = null;
      for (var i = 0; i < sheet.rows.length; i++) if (sheet.rows[i][2] === id) { row = sheet.rows[i]; break; }
      if (!row) return { po: p, missing: true, courses: {} };
      if (!info) info = { id: id, name: row[3], batch: row[1], year: row[0] };
      var cv = {};
      sheet.courses.forEach(function (c, i) { if (row[4][i] != null) { cv[c] = row[4][i]; if (!courseSeen[c]) { courseSeen[c] = true; courseOrder.push([i, c]); } } });
      return { po: p, direct: row[6], indirect: row[5], total: row[7], status: poStatus(d, row), courses: cv };
    });
    if (!info) return null;
    courseOrder.sort(function (a, b) { return a[0] - b[0]; });
    items.forEach(function (x) {                       // average total attainment of the student's batch
      var sum = 0, n = 0;
      d.sheets[x.po].rows.forEach(function (r) { if (r[1] === info.batch && typeof r[7] === "number") { sum += r[7]; n++; } });
      x.batchAverage = n ? sum / n : null;
    });
    var judged = items.filter(function (x) { return x.status === "Y" || x.status === "N"; });
    return { info: info, items: items, threshold: poThreshold(d, info.batch, false), courses: courseOrder.map(function (c) { return c[1]; }),
      attained: judged.filter(function (x) { return x.status === "Y"; }).map(function (x) { return x.po; }), judged: judged.length,
      notAttained: judged.filter(function (x) { return x.status === "N"; }).map(function (x) { return x.po; }) };
  }

  function studentHtml(d, r) {
    var n = r.items.length, sem = d.courseSemesters || {}, mine = (d.studentSemesters || {})[String(r.info.id)] || {};
    var COLS = '<colgroup><col style="width:13%"><col style="width:12%"><col style="width:6.4%"><col span="' + n + '"></colgroup>';
    var head = function (label, cls) { return "<thead><tr class=\"" + cls + "\">" + label + r.items.map(function (x) { return "<th>" + x.po + "</th>"; }).join("") + "</tr></thead>"; };
    var cells = function (f, extra) { return r.items.map(function (x) { var v = f(x); return "<td" + (extra ? extra(x) : "") + ">" + (v == null ? "" : v) + "</td>"; }).join(""); };
    var courseRows = r.courses.map(function (c) {
      return '<tr><td class="l">' + esc(c) + "</td><td>" + esc(mine[c] || sem[c] || "TBA") + "</td><td>" + (d.credits[c] == null ? "" : d.credits[c]) + "</td>" + cells(function (x) { return pct0(x.courses[c]); }) + "</tr>";
    }).join("");
    var rating = function (x) { return typeof x.indirect === "number" ? String(Math.round(x.indirect / 20 * 100) / 100) : ""; };
    return '<article class="paper co po sw">' + poLetterhead("PO Attainment Report (Student)") +
      '<div class="info five"><div class="k">Batch:</div><div class="v">' + esc(r.info.batch) + '</div><div class="k">Student ID:</div><div class="v">' + esc(r.info.id) +
      '</div><div class="k">Name:</div><div class="v">' + esc(r.info.name) + '</div><div class="k">Graduating Year:</div><div class="v">' + esc(r.info.year) +
      '</div><div class="k">Attainment Threshold:</div><div class="v">' + r.threshold + "%</div></div>" +

      '<table class="grid">' + COLS + head('<th class="l">Course</th><th>Semester</th><th>Credit</th>', "f-yellow") + "<tbody>" + courseRows +
      '<tr class="sum f-yellow2"><td class="l" colspan="3">Direct Measurement</td>' + cells(function (x) { return pct0(x.direct); }) + "</tr></tbody></table>" +

      '<table class="grid block">' + COLS + head('<th class="l" colspan="3">Survey</th>', "f-red") + "<tbody>" +
      '<tr><td class="l" colspan="3">Graduate Exit Survey: 1 (Poor), 2 (Fair), 3 (Good), 4 (Very Good), 5 (Excellent)</td>' + cells(rating) + "</tr>" +
      '<tr class="sum f-red2"><td class="l" colspan="3">Indirect Measurement</td>' + cells(function (x) { return pct0(x.indirect); }) + "</tr></tbody></table>" +

      '<table class="grid block">' + COLS + head('<th class="l" colspan="3">Overall</th>', "f-teal") + "<tbody>" +
      '<tr class="sum f-teal2"><td class="l nw" colspan="3">Total Attainment (Direct → 80%, Indirect → 20%)</td>' + cells(function (x) { return pct0(x.total); }) + "</tr>" +
      '<tr class="sum"><td class="l" colspan="3">Attainment Status</td>' + cells(function (x) { return esc(x.status || ""); }, function (x) { return x.status === "N" ? ' class="st-n"' : x.status === "Y" ? ' class="st-y"' : ""; }) + "</tr></tbody></table>" +

      '<div class="figure">' + radar("", [
          { label: "ID " + r.info.id, values: r.items.map(function (x) { return typeof x.total === "number" ? x.total / 100 : null; }), color: "#1e5900" },
          { label: "Batch " + r.info.batch + " (Avg)", values: r.items.map(function (x) { return x.batchAverage == null ? null : x.batchAverage / 100; }), color: "#3d6fb6", thin: true }
        ], r.threshold / 100, 172, r.items.map(function (x) { return x.po + " – " + poTitle(d, x.po).replace(/^PO\d+\s*[-–]\s*/, ""); })) + "</div>" +
      PO_FOOT + "</article>";
  }

  function renderStudentWise(d, params) {
    var years = poYears(d);
    if (!years.length) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no PO attainment rows.</p></div>'; return; }
    var year = years.indexOf(+params.year) >= 0 ? +params.year : poDefaultYear(d, years);
    var batches = poBatches(d, year), batch = batches.indexOf(+params.batch) >= 0 ? +params.batch : batches[0];
    var students = poStudents(d, year, batch);
    var id = students.some(function (s) { return s.id === +params.id; }) ? +params.id : (students[0] && students[0].id);
    var opt = function (v) { return { value: v, label: v }; };
    $("toolbar").innerHTML = selectField("selYear", "Graduating year", years.map(opt), year) +
      selectField("selBatch", "Batch", batches.map(opt), batch) +
      selectField("selStudent", "Student", students.map(function (s) { return { value: s.id, label: s.id + " – " + s.name }; }), id) + PRINT_BTNS;
    $("selYear").onchange = function () { go("student-wise", { year: this.value }); };
    $("selBatch").onchange = function () { go("student-wise", { year: year, batch: this.value }); };
    $("selStudent").onchange = function () { go("student-wise", { year: year, batch: batch, id: this.value }); };
    var r = id == null ? null : computeStudent(d, id);
    $("stage").innerHTML = r ? studentHtml(d, r) : '<div class="notice"><p>No student found for this selection.</p></div>';
    wirePrint("PO Attainment Report (Student) - " + id, "16mm 17.8mm 12mm");
  }

  /* =====================================================================
     PEO Loop Report, Alumni Survey Report, Employer Survey Report
     ===================================================================== */
  var PIE = ["#4285f4", "#ea4335", "#fbbc04", "#34a853", "#ff6d01", "#46bdc6"];
  function pct1(v) { return typeof v === "number" ? (Math.round(v * 1000 + 1e-7) / 10).toFixed(1) + "%" : ""; }
  function pct2(v) { return typeof v === "number" ? (Math.round(v * 10000 + 1e-7) / 100).toFixed(2) + "%" : ""; }

  // Plain column chart with a threshold line. widthMm: printed width, so labels come out at 7pt.
  function columnChart(title, labels, values, threshold, color, widthMm) {
    var W = 300, u = W / widthMm, FS = 2.47 * u, x0 = FS * 3.6, x1 = W - 8, yTop = FS * 2.6, yBase = yTop + 88, H = yBase + FS * 1.9, s = "";
    var y = function (v) { return yBase - v * (yBase - yTop); };
    s += '<text x="' + W / 2 + '" y="' + FS * 1.3 + '" text-anchor="middle" font-weight="bold" font-size="' + FS.toFixed(1) + '">' + esc(title) + "</text>";
    [0, .25, .5, .75, 1].forEach(function (v) {
      s += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#b7b7b7" stroke-width=".7"/>';
      s += '<text x="' + (x0 - 4) + '" y="' + (y(v) + FS * 0.33) + '" text-anchor="end" font-size="' + FS.toFixed(1) + '">' + v * 100 + "%</text>";
    });
    var slot = (x1 - x0) / Math.max(labels.length, 1), bw = Math.min(26, slot * 0.56);
    labels.forEach(function (lab, i) {
      var v = typeof values[i] === "number" ? Math.max(0, Math.min(1, values[i])) : 0, cx = x0 + slot * (i + 0.5);
      s += '<rect x="' + (cx - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + (yBase - y(v)) + '" fill="' + color + '"/>';
      s += '<text x="' + cx + '" y="' + (yBase + FS * 1.25) + '" text-anchor="middle" font-size="' + FS.toFixed(1) + '">' + esc(lab) + "</text>";
    });
    if (typeof threshold === "number") s += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y(threshold) + '" y2="' + y(threshold) + '" stroke="#000" stroke-width="1.4"/>';
    return '<svg viewBox="0 0 ' + W + " " + H.toFixed(1) + '" role="img" aria-label="' + esc(title) + '">' + s + "</svg>";
  }

  // Doughnut chart: percentages on the slices, the full item labels in a legend below it.
  function doughnut(title, items, widthMm) {
    var W = 200, u = W / widthMm, FS = 2.47 * u, cx = W / 2, R = 62, r = 31, cy = FS * 2.6 + R, H = cy + R + 4, s = "", a0 = -Math.PI / 2;
    s += '<text x="' + W / 2 + '" y="' + FS * 1.3 + '" text-anchor="middle" font-weight="bold" font-size="' + FS.toFixed(1) + '">' + esc(title) + "</text>";
    var total = items.reduce(function (t, it) { return t + (it.share || 0); }, 0) || 1, legend = "", n = 0;
    items.forEach(function (it) {
      var frac = (it.share || 0) / total, a1 = a0 + frac * 2 * Math.PI, big = frac > 0.5 ? 1 : 0, col = it.other ? "#b7b7b7" : PIE[n++ % PIE.length];
      var p = function (rad, ang) { return (cx + rad * Math.cos(ang)).toFixed(2) + " " + (cy + rad * Math.sin(ang)).toFixed(2); };
      if (frac >= 0.9999) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R + r) / 2 + '" fill="none" stroke="' + col + '" stroke-width="' + (R - r) + '"/>';
      else if (frac > 0) s += '<path d="M' + p(R, a0) + " A" + R + " " + R + " 0 " + big + " 1 " + p(R, a1) + " L" + p(r, a1) + " A" + r + " " + r + " 0 " + big + " 0 " + p(r, a0) + ' Z" fill="' + col + '" stroke="#fff" stroke-width=".8"/>';
      if (frac >= 0.045) {
        var mid = (a0 + a1) / 2, m = (R + r) / 2;
        s += '<text x="' + (cx + m * Math.cos(mid)).toFixed(1) + '" y="' + (cy + m * Math.sin(mid) + FS * 0.33).toFixed(1) + '" text-anchor="middle" font-size="' + (FS * 0.92).toFixed(1) + '" fill="' + (col === "#fbbc04" || it.other ? "#000" : "#fff") + '">' + pct1(it.share) + "</text>";
      }
      legend += '<li><i style="background:' + col + '"></i>' + esc(it.label) + "</li>";
      a0 = a1;
    });
    return '<svg viewBox="0 0 ' + W + " " + H.toFixed(1) + '" role="img" aria-label="' + esc(title) + '">' + s + '</svg><ul class="lg">' + legend + "</ul>";
  }

  function peoYears(d) { return d.cycles.map(function (c) { return c.year; }).sort(function (a, b) { return a - b; }); }
  function peoCycle(d, params) {
    var years = peoYears(d), year = years.indexOf(+params.year) >= 0 ? +params.year : years[years.length - 1];
    for (var i = 0; i < d.cycles.length; i++) if (d.cycles[i].year === year) return d.cycles[i];
    return null;
  }
  function yearToolbar(view, d, cycle) {
    $("toolbar").innerHTML = selectField("selYear", "Assessment year", peoYears(d).map(function (y) { return { value: y, label: y }; }), cycle.year) + PRINT_BTNS;
    $("selYear").onchange = function () { go(view, { year: this.value }); };
  }

  function computePeo(d, cycle) {                      // total = 50% alumni + 50% employer, rounded to a whole percent (survey-based)
    return cycle.peos.map(function (p) {
      var both = typeof p.alumni === "number" && typeof p.employer === "number";
      var total = both ? Math.round((0.5 * p.alumni + 0.5 * p.employer) * 100 + 1e-9) / 100 : null;
      return { no: p.no, statement: p.statement, alumni: p.alumni, employer: p.employer, total: total,
        status: total == null ? "N/A" : (total * 100 >= d.threshold ? "Y" : "N") };
    });
  }

  function peoLoopHtml(d, c) {
    var rows = computePeo(d, c), one = function (v) { return v == null ? "N/A" : pct1(v); };
    var body = rows.map(function (p) {
      return "<tr><td>" + esc(p.no) + '</td><td class="l">' + esc(p.statement) + "</td><td>" + one(p.alumni) + "</td><td>" + one(p.employer) +
        "</td><td>" + (p.total == null ? "N/A" : Math.round(p.total * 100) + "%") + "</td><td" + (p.status === "N" ? ' class="n"' : "") + ">" + p.status + "</td></tr>";
    }).join("");
    var val = function (k) { return rows.map(function (p) { return p[k]; }); };
    return '<article class="paper co po peo">' + poLetterhead("PEO Loop Report") +
      '<div class="info two"><div class="k">Assessment Year:</div><div class="v">' + esc(c.year) + '</div><div class="k">Cohort Details:</div><div class="v">' + esc(c.cohort) + "</div></div>" +
      '<table class="grid"><colgroup><col style="width:7%"><col><col style="width:11%"><col style="width:11%"><col style="width:17%"><col style="width:10%"></colgroup>' +
      '<thead><tr><th rowspan="2" class="f-teal">PEO No.</th><th rowspan="2" class="f-teal l">PEO Statement</th>' +
      '<th colspan="2" class="f-red">Indirect Measurement</th><th rowspan="2" class="f-pink">Total Attainment<br><span class="nw1">(Alumni Survey → 50%,<br>Employer Survey → 50%)</span></th><th rowspan="2" class="f-purple">Attainment Status</th></tr>' +
      '<tr><th class="sub f-red2">Alumni Survey</th><th class="sub f-red2">Employer Survey</th></tr></thead><tbody>' + body + "</tbody></table>" +
      '<div class="chartbox">' + radar("", [
          { label: "PEO Attainment", values: val("total"), color: "#ff0000" }
        ], d.threshold / 100, 100, null, rows.map(function (p) { return p.no; }), true) + "</div>" +
      '<div class="keep"><div class="box fb"><div class="left"><div class="hd f-teal">Summary of Alumni Feedback</div><div class="tx pre">' + esc(c.alumniFeedback) +
      '</div><div class="hd f-teal">Summary of Employer Feedback</div><div class="tx pre">' + esc(c.employerFeedback) + "</div></div>" +
      '<div class="right"><div class="hd f-red">Recommendations</div><div class="tx pre">' + esc(c.recommendation) + "</div></div></div>" +
      '<div class="box act"><div class="left"><div class="hd f-teal">Action / Improvement Plan</div><div class="tx pre">' + esc(c.action) + "</div></div>" +
      '<div class="right"><div class="hd f-purple">Implementation Status</div><div class="val">' + esc(c.implementation) +
      '</div><div class="hd hd2 f-orange">Loop Status</div><div class="val">' + esc(c.loop) + "</div></div></div>" + PO_FOOT + "</div></article>";
  }

  function renderPeoLoop(d, params) {
    var c = peoCycle(d, params);
    if (!c) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no PEO loop.</p></div>'; return; }
    yearToolbar("peo-loop", d, c);
    $("stage").innerHTML = peoLoopHtml(d, c);
    wirePrint("PEO Loop Report - " + c.year, "16mm 17.8mm 12mm");
  }

  function surveyHtml(sv) {
    var out = "", size = parseInt(sv.size, 10) || 0;
    sv.blocks.forEach(function (b) {
      if (b.type === "text") {
        var i = b.text.indexOf(":"), lead = i > 0 && i < 80 ? b.text.slice(0, i + 1) : "";
        out += '<p class="para"><b>' + esc(lead) + "</b>" + esc(b.text.slice(lead.length)) + "</p>";
        return;
      }
      if (b.kind === "demo") {
        out += '<table class="grid sv"><colgroup><col><col style="width:19%"><col style="width:19%"></colgroup><thead><tr class="f-yellow"><th class="l">Item</th><th>Number of Responses</th><th>In Percentage (%)</th></tr></thead><tbody>' +
          b.sections.map(function (sec) {
            return '<tr class="sec f-blue"><td class="l" colspan="3">' + esc(sec.title) + "</td></tr>" + sec.items.filter(function (it) { return !it.other; }).map(function (it) {
              return '<tr><td class="l ind1">' + esc(it.label) + "</td><td>" + (it.count == null ? "" : it.count) + "</td><td>" + pct2(it.share) + "</td></tr>"; }).join("");
          }).join("") + "</tbody></table>";
        out += '<div class="charts4">' + b.sections.map(function (sec) {
          var given = sec.items.reduce(function (t, it) { return t + (it.other ? 0 : it.count || 0); }, 0), pie = sec.items.filter(function (it) { return !it.other; });
          if (size && given < size) pie.push({ label: "No Response", count: size - given, share: (size - given) / size, other: true });
          return "<div>" + doughnut(sec.title.replace(/^\d+\.\s*/, ""), pie, 42) + "</div>"; }).join("") + "</div>";
      } else {
        b.sections.forEach(function (sec, k) {
          var isPo = !/PEO|Educational Objective/.test(sec.title);
          out += '<table class="grid sv quest' + (k ? " next" : "") + '"><colgroup><col><col style="width:16%"><col style="width:14%"><col style="width:11%"><col style="width:12%"></colgroup>' +
            (k ? "" : '<thead><tr class="f-yellow"><th class="l">Item</th><th>Expected Response</th><th>Number of Expected Responses</th><th>In Percentage (%)</th><th>Satisfactory? (Y/N)*</th></tr></thead>') +
            '<tbody><tr class="sec ' + (isPo ? "f-orange" : "f-green") + '"><td class="l" colspan="5">' + esc(sec.title) + "</td></tr>" + sec.items.map(function (it, i) {
              return '<tr><td class="l ind1">' + esc(it.label) + "</td>" + (i === 0 ? '<td rowspan="' + sec.items.length + '">' + (isPo ? "Very Good (4) or Above" : "Yes") + "</td>" : "") +
                "<td>" + (it.count == null ? "" : it.count) + "</td><td>" + pct2(it.share) + "</td><td" + (it.ok === "N" ? ' class="n"' : "") + ">" + esc(it.ok) + "</td></tr>"; }).join("") +
            "</tbody></table>";
        });
        var th = b.sections[0] && b.sections[0].items[0] && b.sections[0].items[0].threshold;
        out += '<p class="note">* An item is satisfactory (Y) when at least ' + Math.round((typeof th === "number" ? th : 0.5) * 100) +
          "% of the respondents give the expected response; otherwise (N) it calls for improvement actions.</p>";
        out += '<div class="charts2">' + b.sections.map(function (sec) {
          var t = /PEO/.test(sec.title) ? "Response related to PEOs" : /PO/.test(sec.title) ? "Response related to POs" : sec.title.replace(/^\d+\.\s*/, "");
          return "<div>" + columnChart(t, sec.items.map(function (it) { return it.label.split(".")[0]; }), sec.items.map(function (it) { return it.share; }),
            sec.items[0] && sec.items[0].threshold, /PEO/.test(sec.title) ? "#6aa84f" : "#e69138", 84) + "</div>"; }).join("") + "</div>";
      }
    });
    return '<article class="paper co po survey">' + poLetterhead(esc(sv.title)) +
      '<div class="meta-line wide"><div><b>Sample Details:</b>' + esc(sv.sample) + "</div><div><b>Sample Size:</b>" + esc(sv.size) + "</div></div>" + out + PO_FOOT + "</article>";
  }

  function renderSurvey(d, params, which) {
    var c = peoCycle(d, params), sv = c && c[which];
    if (!sv) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no ' + which + " survey.</p></div>"; return; }
    yearToolbar(which + "-survey", d, c);
    $("stage").innerHTML = surveyHtml(sv);
    wirePrint(sv.title + " - " + c.year, "16mm 17.8mm 12mm");
  }

  // exposed for checking the calculations against the Google Sheet
  window.OBE = { computeCoLoop: computeCoLoop, computeFeedback: computeFeedback, computePoWise: computePoWise,
                 computeBatchWise: computeBatchWise, computeStudent: computeStudent, computePeo: computePeo, state: state };

  loadData();
})();
</script>
</body>
