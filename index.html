<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Viewer V2.0</title>
<link rel="icon" href="assets/eee-logo.png">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url(assets/fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url(assets/fonts/inter-latin-600-normal.woff2) format('woff2'); }
  /* Used for the reports only on devices that do not have Times New Roman (phones, Linux). */
  @font-face { font-family: 'Tinos'; font-weight: 400; font-style: normal; font-display: swap; src: url(assets/fonts/tinos-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Tinos'; font-weight: 700; font-style: normal; font-display: swap; src: url(assets/fonts/tinos-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Tinos'; font-weight: 400; font-style: italic; font-display: swap; src: url(assets/fonts/tinos-latin-400-italic.woff2) format('woff2'); }
  :root {
    --teal: #138174; --teal-dark: #184e41; --mint: #eff8f7; --line: #e4ecea;
    --ink: #1f2d2b; --muted: #6b7f7b; --bg: #f5f7f7;
    --font: Inter, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); background: var(--bg); font: 400 14px/1.45 var(--font); }
  button, select, input { font: inherit; color: inherit; }

  /* ---------- application shell ---------- */
  .app { display: grid; grid-template-columns: 208px 1fr; height: 100%; }
  .side { display: flex; flex-direction: column; min-height: 0; background: #fff; }
  .topbar { padding: 14px 22px; text-align: left; border-bottom: 1px solid var(--line); }
  .topbar h1 { margin: 0; font: 600 14px/1.2 var(--font); color: var(--teal); letter-spacing: .04em; white-space: nowrap; }
  .sidebar { flex: 1; min-height: 0; padding: 14px 12px 12px; display: flex; flex-direction: column; overflow: auto; }
  .sidebar h2:not(:first-child) { margin-top: 14px; }
  .sidebar h2 { margin: 0 10px 8px; font: 500 11px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .navbtn { display: block; width: 100%; text-align: left; padding: 5px 10px; margin-bottom: 1px; font-size: 13.5px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--ink); }
  .navbtn:hover { background: var(--mint); }
  .navbtn[aria-current="page"] { background: var(--mint); color: var(--teal); font-weight: 500; }
  .sidebar .meta { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .linkbtn { background: none; border: 0; padding: 0; margin-top: 3px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }

  .main { overflow: auto; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; width: 100%; max-width: 980px; padding: 14px 20px 0; }
  .toolbar:empty { display: none; }
  .field { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .field label { font-size: 12px; color: var(--muted); }
  .field select { padding: 4px 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; max-width: 46vw; cursor: pointer; font-weight: 500; }
  .field select:hover { border-color: var(--line); background: #fff; }
  .btn { padding: 5px 12px; border: 1px solid #cfdcd9; border-radius: 6px; background: #fff; cursor: pointer; white-space: nowrap; }
  .btn.primary { color: var(--teal); border-color: #b9d3ce; }
  .btn.primary:hover { background: var(--mint); }
  .toolbar .spacer { flex: 1; }
  .pick { position: relative; }
  .pick summary { list-style: none; cursor: pointer; padding: 4px 22px 4px 6px; border: 1px solid transparent; border-radius: 6px; font-weight: 500; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .pick summary::-webkit-details-marker { display: none; }
  .pick summary::after { content: ""; position: absolute; right: 8px; top: 50%; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); }
  .pick summary:hover, .pick[open] summary { border-color: var(--line); background: #fff; }
  .pickbox { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.10); padding: 8px 12px 10px; display: grid; grid-template-columns: repeat(3, auto); gap: 4px 16px; }
  .pickbox label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .pickbtns { grid-column: 1 / -1; display: flex; gap: 14px; padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .stage { padding: 14px 20px 48px; display: flex; justify-content: center; width: 100%; }

  .notice { width: min(300px, 100%); margin: 16vh auto 0; }
  .notice h3 { margin: 0 0 8px; font: 500 14px/1.3 var(--font); }
  .notice p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .notice form { display: flex; gap: 6px; }
  .notice input[type=password] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #cfdcd9; border-radius: 6px; background: #fff; }
  .notice .hint { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
  .notice .err { color: #a3261e; font-size: 12px; margin: 6px 2px 0; min-height: 1.2em; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20; background: var(--teal-dark); color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: 90vw; }

  /* ---------- the printed sheet (shared) ---------- */
  .paper {
    width: 210mm; flex: none; background: #fff; color: #000;
    box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 28px rgba(0,0,0,.10);
    font-family: "Times New Roman", Times, "TeX Gyre Termes", Tinos, "Liberation Serif", serif; font-size: 7pt; line-height: 1.18;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .paper table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .paper svg text { font-family: inherit; }
  .paper td, .paper th { padding: 0.6mm 1.1mm; font-weight: normal; vertical-align: middle; overflow-wrap: anywhere; }
  .paper b, .paper .b { font-weight: bold; }
  .paper .c { text-align: center; }
  .pre { white-space: pre-wrap; }

  .letterhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .letterhead img { display: block; }
  .letterhead .gub { justify-self: start; }
  .letterhead .eee { justify-self: end; }
  .letterhead .lh-text { text-align: center; }

  /* ---------- CO Loop Report ---------- */
  .paper.co { min-height: 297mm; padding: 16mm 17.8mm 15mm; }
  .co .letterhead .gub { height: 11.5mm; }
  .co .letterhead .eee { height: 13.2mm; }
  .co .lh-1 { font-size: 13.6pt; font-weight: bold; line-height: 1.5; }
  .co .lh-2 { font-size: 10.2pt; line-height: 1.55; }
  .co .lh-3 { font-size: 8.9pt; line-height: 1.5; }
  .co .lh-4 { font-size: 8.2pt; font-weight: bold; line-height: 1.5; }
  .co .info { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1.6fr; column-gap: 2mm; margin-top: 4.2mm; align-items: end; }
  .co .info .k { font-weight: bold; padding-left: 1.1mm; }
  .co .info .v + .k { padding-left: 3mm; }
  .co .info .v { text-align: center; border-bottom: .26mm solid #000; padding-bottom: .4mm; min-height: 3.6mm; }
  .co .cotable { margin-top: 3.3mm; border: .26mm solid #000; }
  .co .cotable th { border: .26mm solid #000; font-weight: bold; text-align: center; height: 5.3mm; }
  .co .cotable th.l { text-align: left; }
  .co .cotable td { border-left: .26mm solid #000; border-right: .26mm solid #000; }
  .co .cotable tr.filler td { padding: 0; }
  .co .cobody { vertical-align: top; }
  .f-teal { background: #d0e0e3; } .f-orange { background: #fce5cd; } .f-red { background: #f4cccc; } .f-purple { background: #d9d2e9; }
  .co .charts { border: .26mm solid #000; border-top: 0; display: grid; grid-template-columns: repeat(3, 1fr); height: 37.8mm; padding: 0 1mm; }
  .co .charts svg { width: 100%; height: 100%; display: block; }
  .co .box { border: .26mm solid #000; margin-top: 3.8mm; display: grid; }
  .co .box .hd { font-weight: bold; text-align: center; border-bottom: .26mm solid #000; padding: .6mm 1.1mm; }
  .co .box .tx { padding: .8mm 1.1mm; }
  .co .fb { grid-template-columns: 58.26% 41.74%; }
  .co .fb .left { border-right: .26mm solid #000; display: flex; flex-direction: column; }
  .co .fb .left .tx { min-height: 19.3mm; }
  .co .fb .left .hd + .tx + .hd { border-top: .26mm solid #000; }
  .co .fb .right { display: flex; flex-direction: column; }
  .co .act { grid-template-columns: 68.7% 31.3%; }
  .co .act .left { border-right: .26mm solid #000; }
  .co .act .left .tx { min-height: 11.2mm; }
  .co .act .right { display: flex; flex-direction: column; }
  .co .act .right .val { text-align: center; min-height: 3.7mm; padding: .45mm .8mm; flex: 1; display: flex; align-items: center; justify-content: center; }
  .co .act .right .hd2 { border-top: .26mm solid #000; }
  .paper .foot { display: block; width: 100%; text-align: center; font-style: italic; margin: 9.5mm 0 0; padding: 0; }
  .ff .foot { margin-top: 6mm; }

  /* ---------- PO Loop reports ---------- */
  .po .info { grid-template-columns: auto 1fr auto 1fr auto 1fr; }
  .po .info.four { grid-template-columns: auto .8fr auto 1.8fr auto .6fr auto .7fr; }
  .po table.grid { margin-top: 3.3mm; }
  .po table.grid th, .po table.grid td { border: .26mm solid #000; text-align: center; }
  .po table.tight td, .po table.tight th { padding-left: .2mm; padding-right: .2mm; }
  .po table.tight td { white-space: nowrap; height: 5.6mm; }
  .po table.grid th { font-weight: bold; height: 5.3mm; }
  .po table.grid td.l, .po table.grid th.l { text-align: left; }
  .po table.grid tr.all td { font-weight: bold; }
  .f-blue { background: #cfe2f3; } .f-yellow { background: #fff2cc; } .f-yellow2 { background: #fff7e0; }
  .f-red2 { background: #ffe5e5; } .f-pink { background: #ead1dc; }
  .po .potable { margin-top: 3.3mm; border: .26mm solid #000; }
  .po .potable th { border: .26mm solid #000; font-weight: bold; text-align: center; }
  .po .potable th.l { text-align: left; }
  .po .potable th.rot { height: 14.5mm; padding: .6mm 0; font-weight: normal; font-size: 6.4pt; vertical-align: middle; }
  .po .potable th.rot span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .po .potable th.sub { font-weight: normal; }
  .po .potable td { text-align: center; height: 3.7mm; padding-left: .3mm; padding-right: .3mm; }
  .po .potable td.l { text-align: left; padding-left: 1.1mm; }
  .po .potable td.g, .po .potable th.g { border-left: .26mm solid #000; }
  .po .potable tr { break-inside: avoid; }
  .po .keep { break-inside: avoid; }
  .po .trio { grid-template-columns: 35% 31% 34%; }
  .po .nw1 { white-space: nowrap; font-size: 6pt; font-weight: normal; }
  .po .potable th, .peo table.grid th { overflow-wrap: normal; }
  .po .potable td { white-space: nowrap; }
  .po .potable td.l { white-space: normal; }
  .po .trio .hd, .po .trio .who { white-space: nowrap; }
  .po .trio > div { display: flex; flex-direction: column; }
  .po .trio > div + div { border-left: .26mm solid #000; }
  .po .trio .mid { flex: 1; display: flex; align-items: center; padding: 1mm 1.2mm; min-height: 11mm; }
  .po .trio .mid.c { justify-content: center; text-align: center; }
  .po .trio .cohort { flex: 1; display: grid; grid-template-columns: 1fr 34%; }
  .po .trio .cohort > div { display: flex; align-items: center; justify-content: center; font-size: 17pt; }
  .po .badge-Y { background: #1e5900; color: #fff; } .po .badge-N { background: #660000; color: #fff; } .po .badge-NA { background: #0b5394; color: #fff; }
  .po .fb2 { grid-template-columns: 52% 48%; }
  .po .fb2 .left { border-right: .26mm solid #000; }
  .po .fb2 .tx { min-height: 14mm; }
  .po .act { grid-template-columns: 52% 48%; }
  .po .meta-line { display: flex; justify-content: center; gap: 16mm; margin-top: 4.2mm; }
  .po .meta-line b { margin-right: 3mm; }
  .po .comment { display: grid; grid-template-columns: auto 1fr; column-gap: 3mm; margin: 3.4mm 12mm 0; }
  .po .radars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-top: 4.5mm; }
  .po .radars.c2 { grid-template-columns: repeat(2, 1fr); padding: 0 29mm; }
  .po .radars.c1 { grid-template-columns: 1fr; padding: 0 58mm; }
  .po .radar { border: .2mm solid #d9d9d9; break-inside: avoid; }
  .po .radar svg { display: block; width: 100%; height: auto; }
  .po .duo { display: grid; grid-template-columns: 46% 1fr; gap: 4mm; margin-top: 4mm; align-items: stretch; break-inside: avoid; }
  .po .duo .box { margin-top: 0; }
  .po .sumbox { display: flex; flex-direction: column; gap: 3mm; }
  .po .sumbox .box { grid-template-columns: 1fr; }
  .po .sumbox .big { text-align: center; font-size: 15pt; padding: 2.2mm 1mm; }
  .po .sumbox .tx { min-height: 8mm; }
  .po .info.five { grid-template-columns: auto .55fr auto .9fr auto 2.3fr auto .5fr auto .45fr; column-gap: 1.6mm; }
  .po .info.five .v + .k { padding-left: 1.6mm; }
  .po h4 { margin: 4.2mm 0 0; font-size: 7pt; font-weight: bold; text-align: left; padding-left: 1.1mm; }
  .po h4 + table.grid { margin-top: 1.2mm; }
  .sw table.grid td, .sw table.grid th { height: 4.5mm; }
  .sw table.grid tr.sum td { font-weight: bold; }
  .sw td.st-y { background: #1e5900; color: #fff; } .sw td.st-n { background: #660000; color: #fff; }
  .sw table.grid { margin-top: 4.2mm; }
  .sw table.grid.block { margin-top: 2.2mm; }
  .sw td.nw { white-space: nowrap; font-size: 6.7pt; }
  .sw .figure { border: .26mm solid #000; margin-top: 5mm; padding: 1.5mm 0 1mm; break-inside: avoid; }
  .sw .figure svg { display: block; width: 100%; height: auto; }
  .f-teal2 { background: #e7eff1; }
  .sw .foot { margin-top: 7mm; }
  .po td.n { color: #660000; font-weight: bold; }

  /* ---------- PEO Loop and survey reports ---------- */
  .po .info.two { grid-template-columns: auto .5fr auto 2.4fr; }
  .peo th.rot { height: 9.5mm; padding: .6mm 0; font-weight: normal; font-size: 6.4pt; }
  .peo th.rot span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .peo th.sub { font-weight: normal; }
  .peo table.grid td { height: 7mm; }
  .peo .chartbox { border: .26mm solid #000; border-top: 0; padding: 2mm 0 1mm; }
  .peo .chartbox svg { display: block; width: 100mm; margin: 0 auto; }
  .f-green { background: #d9ead3; }
  .survey .meta-line.wide { justify-content: space-between; gap: 6mm; padding: 0 1.1mm; }
  .survey table.sv td, .survey table.sv th { height: 4.4mm; }
  .survey table.sv tr.sec td { font-weight: bold; }
  .survey table.sv td.ind1 { padding-left: 4mm; }
  .survey table.sv tr { break-inside: avoid; }
  .survey table.sv.next { margin-top: -.26mm; }
  .survey table.sv.quest { break-inside: avoid; }
  .survey .charts4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2mm; margin-top: 3mm; break-inside: avoid; align-items: start; }
  .survey .charts2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4mm; margin-top: 3mm; break-inside: avoid; }
  .survey .charts4 svg, .survey .charts2 svg { display: block; width: 100%; height: auto; }
  .survey .para { margin: 3.4mm 1.1mm 0; text-align: justify; }
  .survey ul.lg { list-style: none; margin: 1.2mm 1mm 0 2mm; padding: 0; }
  .survey ul.lg li { position: relative; padding-left: 3.4mm; margin-bottom: .5mm; }
  .survey ul.lg i { position: absolute; left: 0; top: .55mm; width: 2.2mm; height: 2.2mm; }
  .f-orange { background: #fce5cd; }
  .survey .note { margin: 1.2mm 1.1mm 0; font-style: italic; }

  /* ---------- Faculty Feedback Summary Report ---------- */
  .paper.ff { padding: 8mm 9mm 9mm; }
  .ff .letterhead .gub { height: 10mm; }
  .ff .letterhead .eee { height: 11.6mm; }
  .ff .lh-1 { font-size: 11.6pt; font-weight: bold; line-height: 1.45; }
  .ff .lh-2 { font-size: 8.9pt; line-height: 1.45; }
  .ff .lh-3 { font-size: 8.9pt; line-height: 1.45; }
  .ff .lh-4 { font-size: 7.5pt; font-weight: bold; line-height: 1.5; }
  .ff .info { display: flex; justify-content: space-between; padding: 3.4mm 1.1mm 2.2mm; }
  .ff .info b { margin-right: 2.6mm; }
  .ff .info .n { display: inline-block; min-width: 5mm; text-align: right; }
  .ff thead td { padding: 0; }
  .ff thead th { border: .26mm solid #000; background: #efefef; font-weight: bold; text-align: left; height: 4.4mm; }
  .ff tbody td { border-left: .26mm solid #000; border-right: .26mm solid #000; height: 3.9mm; }
  .ff tbody tr:last-child td { border-bottom: .26mm solid #000; }
  .ff tr.cat { break-inside: avoid; }
  .ff tr.gap td { height: 2.9mm; padding: 0; }
  .ff td.cat { text-align: center; }
  .ff td.ind { vertical-align: middle; }
  .ff .grey { background: #efefef; }
  .ff tr.obs td { padding-top: 1mm; padding-bottom: 1mm; }
  .ff tr.rec td { padding-top: .5mm; padding-bottom: .5mm; }
  .ff tr.rec { break-inside: avoid; }
  .ff td.top { vertical-align: top; }
  .ff .flow { height: 0; overflow: visible; }
  .c-sa { background: #b6d7a8; } .c-a { background: #d9ead3; } .c-n { background: #fce5cd; } .c-d { background: #f4cccc; } .c-sd { background: #e6b8af; }

  /* ---------- small screens ---------- */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
    .side { border-bottom: 1px solid var(--line); }
    .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .sidebar h2 { display: none; }
    .navbtn { width: auto; margin: 0; }
    .sidebar .meta { margin: 0 0 0 auto; padding: 0; text-align: right; }
    .main { overflow: visible; }
    .stage { padding: 12px 8px 40px; justify-content: flex-start; overflow-x: auto; }
  }

  /* ---------- printing: only the sheet ---------- */
  @media print {
    html, body { height: auto; background: #fff; }
    .side, .topbar, .sidebar, .toolbar, .toast, .notice { display: none !important; }
    .app, .main, .stage { display: block; height: auto; overflow: visible; padding: 0; margin: 0; }
    .paper { zoom: 1 !important; box-shadow: none; width: auto; padding: 0 .3mm !important; min-height: 0 !important; margin: 0; }
  }
</style>
<style id="page-rule"></style>
</head>
<body>
<div class="app">
  <div class="side">
  <header class="topbar"><h1>Report Viewer V2.0</h1></header>

  <nav class="sidebar" aria-label="Reports">
    <h2>CO Loop</h2>
    <button class="navbtn" data-view="co-loop">CO Loop Report</button>
    <h2>PO Loop</h2>
    <button class="navbtn" data-view="po-wise">PO Loop Report</button>
    <button class="navbtn" data-view="batch-wise">Batch-Wise Summary</button>
    <button class="navbtn" data-view="student-wise">Student-Wise</button>
    <h2>PEO Loop</h2>
    <button class="navbtn" data-view="peo-loop">PEO Loop Report</button>
    <h2>Feedback / Survey</h2>
    <button class="navbtn" data-view="survey-eee400-student">Student (EEE 400)</button>
    <button class="navbtn" data-view="survey-eee450-student">Student (EEE 450)</button>
    <button class="navbtn" data-view="faculty-feedback">Faculty</button>
    <button class="navbtn" data-view="survey-eee400-faculty">Faculty (EEE 400)</button>
    <button class="navbtn" data-view="survey-eee450-faculty">Faculty (EEE 450)</button>
    <button class="navbtn" data-view="alumni-survey">Alumni</button>
    <button class="navbtn" data-view="employer-survey">Employer</button>
    <div class="meta">
      <div id="updated"></div>
      <button class="linkbtn" id="lockBtn" hidden>Sign out</button>
    </div>
  </nav>
  </div>

  <main class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="stage" id="stage"><div class="notice"><p>Loading data…</p></div></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     Settings
     ===================================================================== */
  // Add ?data=trial to the address to view the trial database file instead of the live one.
  var TRIAL = /[?&]data=trial\b/.test(location.search);
  var DATA_URL = TRIAL ? "data/obe-data-trial.json" : "data/obe-data.json";
  var DEFAULT_THRESHOLD = 0.40;             // used only if the data file carries no threshold setting
  var SEMESTERS = ["Spring", "Summer", "Fall"];
  var SEM_STYLE = {

  /* =====================================================================
     Small helpers
     ===================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pct(v) { return (Math.round(v * 10000 + 1e-7) / 100).toFixed(2) + "%"; }
  function store(get, key, val) {
    try {
      if (get) return window.localStorage.getItem(key);
      if (val == null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, val);
    } catch (e) { /* storage unavailable: carry on without it */ }
    return null;
  }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 6000);
  }

  /* =====================================================================
     Data loading and optional passcode protection
     ===================================================================== */
  var state = { file: null, data: {}, passcode: null, view: "co-loop", params: {} };
  var SECTION = { "co-loop": "coLoop", "faculty-feedback": "facultyFeedback",
                  "po-wise": "poLoop", "batch-wise": "poLoop", "student-wise": "poLoop",
                  "peo-loop": "peoLoop", "alumni-survey": "peoLoop", "employer-survey": "peoLoop",
                  "survey-eee400-student": "courseSurveys", "survey-eee450-student": "courseSurveys",
                  "survey-eee400-faculty": "courseSurveys", "survey-eee450-faculty": "courseSurveys" };
  var SECTIONS = ["coLoop", "facultyFeedback", "poLoop", "peoLoop", "courseSurveys"];

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  function decrypt(section, passcode) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(passcode), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: b64(section.salt), iterations: section.iter },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(section.iv) }, key, b64(section.ct));
    }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  // Makes state.data[name] available if possible. Resolves true when it is.
  function openSection(name, passcode) {
    var s = state.file[name];
    if (!s) return Promise.resolve(false);
    if (state.data[name]) return Promise.resolve(true);
    if (!s.enc) { state.data[name] = s.data; return Promise.resolve(true); }
    if (!passcode) return Promise.resolve(false);
    return decrypt(s, passcode.trim().toLowerCase()).then(function (d) { state.data[name] = d; return true; }, function () { return false; });
  }

  function useFile(file) {
    state.file = file; state.data = {};
    var saved = store(true, "obe-passcode");
    state.passcode = saved;
    return Promise.all(SECTIONS.map(function (n) { return openSection(n, saved); })).then(function () {
      var d = file.generated ? new Date(file.generated) : null;
      $("updated").textContent = (TRIAL ? "TRIAL DATA. " : "") + (d && !isNaN(d) ? "Data updated: " + d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "");
      $("lockBtn").hidden = !saved;
      route();
    });
  }

  function loadData() {
    fetch(DATA_URL, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(useFile).catch(function () {
      $("toolbar").innerHTML = "";
      $("stage").innerHTML =
        '<div class="notice"><h3>Data file not found</h3>' +
        '<p>The page could not read <code>' + esc(DATA_URL) + '</code>. On the website this means the file is missing from the repository. ' +
        'If you opened this page straight from your computer, choose the data file below.</p>' +
        '<input type="file" id="pick" accept=".json,application/json"></div>';
      $("pick").addEventListener("change", function (e) {
        var f = e.target.files[0]; if (!f) return;
        f.text().then(function (t) { return useFile(JSON.parse(t)); }).catch(function () { toast("That file could not be read as an OBE data file."); });
      });
    });
  }

  function showLock(name) {
    $("toolbar").innerHTML = "";
    $("stage").innerHTML =
      '<div class="notice"><form id="lockForm"><input type="password" id="pc" placeholder="Password" autocomplete="current-password" aria-label="Password" required>' +
      '<button class="btn primary" type="submit" aria-label="Enter">→</button></form>' +
      (state.file.hint ? '<p class="hint">Hint: ' + esc(state.file.hint) + "</p>" : "") +
      '<p class="err" id="lockErr" role="alert"></p></div>';
    $("pc").focus();
    $("lockForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var pc = $("pc").value;
      if (!window.crypto || !crypto.subtle) { $("lockErr").textContent = "This browser cannot unlock the data. Open the site over https in a current browser."; return; }
      openSection(name, pc).then(function (ok) {
        if (!ok) { $("lockErr").textContent = "Incorrect password"; $("pc").select(); return; }
        state.passcode = pc;
        store(false, "obe-passcode", pc); $("lockBtn").hidden = false;
        Promise.all(SECTIONS.map(function (n) { return openSection(n, pc); })).then(route);
      });
    });
  }

  $("lockBtn").addEventListener("click", function () {
    store(false, "obe-passcode", null); state.passcode = null; $("lockBtn").hidden = true;
    SECTIONS.forEach(function (n) { if (state.file[n] && state.file[n].enc) delete state.data[n]; });
    route();
  });

  /* =====================================================================
     Routing (the address bar keeps the selected report, so links can be shared)
     ===================================================================== */
  function readHash() {
    var h = location.hash.replace(/^#\/?/, ""), parts = h.split("?");
    var params = {};
    (parts[1] || "").split("&").forEach(function (kv) {
      if (!kv) return; var i = kv.indexOf("=");
      params[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    });
    return { view: SECTION[parts[0]] ? parts[0] : "co-loop", params: params };
  }
  function go(view, params) {
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    var h = "#/" + view + (q ? "?" + q : "");
    if (location.hash === h) route(); else location.hash = h;
  }
  function route() {
    if (!state.file) return;
    var r = readHash(); state.view = r.view; state.params = r.params;
    document.querySelectorAll(".navbtn").forEach(function (b) {
      if (b.dataset.view === r.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    var name = SECTION[r.view];
    if (!state.data[name]) {
      if (state.file[name] && state.file[name].enc) return showLock(name);
      $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><h3>No data</h3><p>The data file does not contain this report.</p></div>';
      return;
    }
    var d = state.data[name];
    if (r.view === "co-loop") renderCoLoop(d, r.params);
    else if (r.view === "faculty-feedback") renderFeedback(d, r.params);
    else if (r.view === "po-wise") renderPoWise(d, r.params);
    else if (r.view === "batch-wise") renderBatchWise(d, r.params);
    else if (r.view === "peo-loop") renderPeoLoop(d, r.params);
    else if (/^survey-/.test(r.view)) renderCourseSurvey(d, r.params, r.view.split("-")[1], r.view.split("-")[2]);
    else if (r.view === "alumni-survey") renderSurvey(d, r.params, "alumni");
    else if (r.view === "employer-survey") renderSurvey(d, r.params, "employer");
    else renderStudentWise(d, r.params);
    fit();
  }
  window.addEventListener("hashchange", route);
  document.querySelectorAll(".navbtn").forEach(function (b) {
    b.addEventListener("click", function () { go(b.dataset.view, {}); });
  });

  /* =====================================================================
     Toolbar pieces, printing
     ===================================================================== */
  function selectField(id, label, options, value) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">' +
      options.map(function (o) { return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value) ? " selected" : "") + ">" + esc(o.label) + "</option>"; }).join("") +
      "</select></div>";
  }
  var PRINT_BTNS = '<div class="spacer"></div><button class="btn primary" id="printBtn" title="Opens the print window. Choose Save as PDF there to download.">Print / PDF</button>';

  function wirePrint(fileName, pageMargin) {
    $("page-rule").textContent = "@page { size: A4 portrait; margin: " + pageMargin + "; }";
    $("printBtn").onclick = function () {
      var old = document.title;
      document.title = fileName;                       // becomes the suggested PDF file name
      var back = function () { document.title = old; window.removeEventListener("afterprint", back); };
      window.addEventListener("afterprint", back);
      window.print();
    };
  }

  // Scale the on-screen sheet to the space available (print always uses true size).
  function fit() {
    var p = document.querySelector(".paper"); if (!p) return;
    p.style.zoom = 1;
    var room = $("stage").clientWidth - 40, w = p.offsetWidth;
    p.style.zoom = Math.max(0.42, Math.min(1.15, room / w));

  window.addEventListener("resize", fit);

  /* =====================================================================
     CO Loop Report: same rules as the Google Sheet
     ===================================================================== */
  // attainment row: [year, semester, course, section, coNo, statementIndex, value|null]
  // loop row:       [year, course, student, instructor, recommendation, action, implementation, loop]
  function thresholdFor(d, year) {
    var t = (d.settings && d.settings.threshold) || {};
    var v = t.byYear && t.byYear[year] != null ? t.byYear[year] : t["default"];
    return typeof v === "number" ? v : DEFAULT_THRESHOLD;
  }

  function computeCoLoop(d, year, code) {
    var rows = d.attainment.filter(function (r) { return r[0] === year && r[2] === code; });
    var max = 0;
    rows.forEach(function (r) { var m = /CO(\d+)/.exec(r[4]); if (m) max = Math.max(max, +m[1]); });
    var cos = [];
    for (var i = 1; i <= max; i++) {
      var co = "CO" + i, first = null, sems = {};
      rows.forEach(function (r) { if (r[4] === co && !first) first = r; });
      SEMESTERS.forEach(function (s) {
        var sum = 0, n = 0;                            // average over all sections with a numeric value
        rows.forEach(function (r) { if (r[1] === s && r[4] === co && typeof r[6] === "number") { sum += r[6]; n++; } });
        sems[s] = n ? sum / n : null;                  // null is shown as N/A
      });
      cos.push({ co: co, statement: first ? d.statements[first[5]] : "", sems: sems });
    }
    var loop = null;
    for (var j = 0; j < d.loops.length; j++) if (d.loops[j][0] === year && d.loops[j][1] === code) { loop = d.loops[j]; break; }
    var title = "";
    for (var k = 0; k < d.courses.length; k++) if (d.courses[k][0] === code) { title = d.courses[k][1]; break; }
    var f = function (i) { return loop ? loop[i] : "N/A"; };
    return { year: year, code: code, title: title, cos: cos, threshold: thresholdFor(d, year),
      student: f(2), instructor: f(3), recommendation: f(4), action: f(5), implementation: f(6), loop: f(7) };
  }

  function coChart(sem, cos, threshold) {
    var W = 300, H = 190, x0 = 70, x1 = 272, yTop = 46, yBase = 150, dx = 7, dy = 5;
    var color = SEM_STYLE[sem].bar, s = "";
    var y = function (v) { return yBase - v * (yBase - yTop); };
    var n0 = Math.max(cos.length, 1), FS = Math.min(12.6, (x1 - x0) / n0 * 0.52);
    var AX = 'font-size="12.6"';
    s += '<text x="' + ((x0 + x1) / 2 - 20) + '" y="24" text-anchor="middle" font-weight="bold" font-size="14">' + sem + "</text>";
    [0, .25, .5, .75, 1].forEach(function (v) {
      s += '<line x1="' + (x0 + dx) + '" x2="' + (x1 + dx) + '" y1="' + (y(v) - dy) + '" y2="' + (y(v) - dy) + '" stroke="#b7b7b7" stroke-width=".8"/>';
      s += '<text x="' + (x0 - 12) + '" y="' + (y(v) + 4.2) + '" text-anchor="end" ' + AX + ">" + (v * 100).toFixed(2) + "%</text>";
    });
    s += '<polygon points="' + x0 + "," + yBase + " " + x1 + "," + yBase + " " + (x1 + dx) + "," + (yBase - dy) + " " + (x0 + dx) + "," + (yBase - dy) + '" fill="#e3e3e3"/>';
    var n = Math.max(cos.length, 1), slot = (x1 - x0) / n, bw = Math.min(21, slot * 0.36);
    cos.forEach(function (c, i) {
      var v = c.sems[sem]; v = typeof v === "number" ? Math.max(0, Math.min(1, v)) : 0;   // N/A plots as zero
      var cx = x0 + slot * (i + 0.5), l = cx - bw / 2, r = cx + bw / 2, t = y(v);
      var side = r + "," + t + " " + (r + dx) + "," + (t - dy) + " " + (r + dx) + "," + (yBase - dy) + " " + r + "," + yBase;
      var top = l + "," + t + " " + r + "," + t + " " + (r + dx) + "," + (t - dy) + " " + (l + dx) + "," + (t - dy);
      s += '<polygon points="' + side + '" fill="' + color + '"/><polygon points="' + side + '" fill="#000" opacity=".28"/>';
      s += '<rect x="' + l + '" y="' + t + '" width="' + bw + '" height="' + (yBase - t) + '" fill="' + color + '"/>';
      s += '<polygon points="' + top + '" fill="' + color + '"/><polygon points="' + top + '" fill="#fff" opacity=".16"/>';
      s += '<text x="' + (cx + 2) + '" y="' + (yBase + 17) + '" text-anchor="middle" font-size="' + FS.toFixed(1) + '">' + c.co + "</text>";
    });
    var ty = y(threshold) - dy / 2;
    s += '<line x1="' + (x0 - 8) + '" x2="' + (x1 + 10) + '" y1="' + ty + '" y2="' + ty + '" stroke="#000" stroke-width="1.5"/>';
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + sem + ' attainment by CO, threshold ' + Math.round(threshold * 1000) / 10 + '%">' + s + "</svg>";
  }

  function coLoopHtml(r) {
    var cell = function (v) { return v == null ? "N/A" : pct(v); };
    var stat = function (v) { return v == null ? "N/A" : (v >= r.threshold ? "Y" : "N"); };
    var body = r.cos.map(function (c) {
      return "<tr><td>" + esc(c.co) + '</td><td class="pre">' + esc(c.statement) + "</td>" +
        SEMESTERS.map(function (s) { return '<td class="c">' + cell(c.sems[s]) + '</td><td class="c">' + stat(c.sems[s]) + "</td>"; }).join("") + "</tr>";
    }).join("");
    var fillerH = Math.max(0, 63 - r.cos.length * 9.6);
    return '<article class="paper co">' +
      '<div class="letterhead"><img class="gub" src="assets/gub-logo.png" alt="">' +
      '<div class="lh-text"><div class="lh-1">Green University of Bangladesh</div><div class="lh-2">Department of Electrical and Electronic Engineering</div>' +
      '<div class="lh-3">Continuous Quality Improvement (CQI) Committee</div><div class="lh-4">CO Loop Report</div></div>' +
      '<img class="eee" src="assets/eee-logo.png" alt=""></div>' +
      '<div class="info"><div class="k">Year:</div><div class="v">' + esc(r.year) + '</div><div class="k">Course Code:</div><div class="v">' + esc(r.code) +
      '</div><div class="k">Course Title:</div><div class="v">' + esc(r.title) + "</div></div>" +
      '<table class="cotable"><colgroup><col style="width:6.1%"><col style="width:31.3%"><col span="6" style="width:10.433%"></colgroup>' +
      '<thead><tr><th rowspan="2" class="f-teal l">CO No.</th><th rowspan="2" class="f-teal l">CO Statement</th>' +
      SEMESTERS.map(function (s) { return '<th colspan="2" class="' + SEM_STYLE[s].fill + '">' + s + "</th>"; }).join("") + "</tr><tr>" +
      SEMESTERS.map(function (s) { return '<th class="' + SEM_STYLE[s].fill + '">% Student Attainment</th><th class="' + SEM_STYLE[s].fill + '">Attainment Status</th>'; }).join("") +
      '</tr></thead><tbody class="cobody">' + body +
      '<tr class="filler">' + new Array(9).join('<td style="height:' + fillerH + 'mm"></td>') + "</tr></tbody></table>" +
      '<div class="charts">' + SEMESTERS.map(function (s) { return coChart(s, r.cos, r.threshold); }).join("") + "</div>" +
      '<div class="box fb"><div class="left"><div class="hd f-teal">Summary of Student\'s Feedback</div><div class="tx pre">' + esc(r.student) +
      '</div><div class="hd f-teal">Summary of Course Instructor\'s Feedback</div><div class="tx pre">' + esc(r.instructor) + "</div></div>" +
      '<div class="right"><div class="hd f-red">Recommendations</div><div class="tx pre">' + esc(r.recommendation) + "</div></div></div>" +
      '<div class="box act"><div class="left"><div class="hd f-teal">Action / Improvement Plan</div><div class="tx pre">' + esc(r.action) + "</div></div>" +
      '<div class="right"><div class="hd f-purple">Implementation Status</div><div class="val">' + esc(r.implementation) +
      '</div><div class="hd hd2 f-orange">Loop Status</div><div class="val">' + esc(r.loop) + "</div></div></div>" +
      '<div class="foot">This is an automatically generated report. No signature required.</div></article>';
  }

  function renderCoLoop(d, params) {
    var has = {};                                      // year -> {course: true}
    var mark = function (y, c) { (has[y] = has[y] || {})[c] = true; };
    d.attainment.forEach(function (r) { mark(r[0], r[2]); });
    d.loops.forEach(function (r) { mark(r[0], r[1]); });
    var firstYear = d.settings && d.settings.firstYear;      // earlier years stay in the file but are not offered
    var years = Object.keys(has).map(Number).filter(function (y) { return firstYear == null || y >= firstYear; }).sort(function (a, b) { return a - b; });
    if (!years.length) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><h3>No data</h3><p>The data file has no CO attainment rows.</p></div>'; return; }
    var year = years.indexOf(+params.year) >= 0 ? +params.year : years[years.length - 1];   // newest by default
    var titles = {}; d.courses.forEach(function (c) { titles[c[0]] = c[1]; });
    var courses = Object.keys(has[year]).sort();
    var code = courses.indexOf(params.course) >= 0 ? params.course : courses[0];

    $("toolbar").innerHTML =
      selectField("selYear", "Year", years.map(function (y) { return { value: y, label: y }; }), year) +
      selectField("selCourse", "Course", courses.map(function (c) { return { value: c, label: c + (titles[c] ? " – " + titles[c] : "") }; }), code) +
      PRINT_BTNS;
    $("selYear").onchange = function () { go("co-loop", { year: this.value, course: code }); };
    $("selCourse").onchange = function () { go("co-loop", { year: year, course: this.value }); };

    $("stage").innerHTML = coLoopHtml(computeCoLoop(d, year, code));
    wirePrint("CO Loop Report - " + code + " - " + year, "16mm 17.8mm 12mm");
  }

  /* =====================================================================
     Faculty Feedback Summary Report: same rules as the Google Sheet
     ===================================================================== */
  function semRank(s) {
    var m = /(\w+)\s+(\d{4})/.exec(s); if (!m) return 0;
    var i = SEMESTERS.indexOf(m[1]); return +m[2] * 10 + (i < 0 ? 9 : i);
  }
  function uniqueSorted(list) {
    var seen = {}, out = [];
    list.forEach(function (c) { if (!seen[c]) { seen[c] = true; out.push(c); } });
    return out.sort(function (a, b) { return a < b ? -1 : a > b ? 1 : 0; });
  }

  function computeFeedback(d, semester) {
    var rows = d.responses.filter(function (r) { return r.sem === semester; });

  function feedbackHtml(r, opt) {

  function renderFeedback(d, params) {

  /* =====================================================================
     Course surveys: student and faculty feedback on one course (EEE 400, EEE 450)
     ===================================================================== */
  var CS_SCALE = {
    rating: [[5, "Excellent", "c-sa"], [4, "Very Good", "c-a"], [3, "Good", "c-n"], [2, "Fair", "c-d"], [1, "Poor", "c-sd"]],
    agree: [[5, "Strongly Agree", "c-sa"], [4, "Agree", "c-a"], [3, "Neutral", "c-n"], [2, "Disagree", "c-d"], [1, "Strongly Disagree", "c-sd"]]
  };
  function csShare(k, n) { return (n ? Math.round(k / n * 100 + 1e-9) : 0) + "% of total respondents"; }
  function computeCourseSurvey(g, semester) {
    // A person who answered more than once counts once, with the latest answer: students by ID, faculty
    // by name (ignoring dots, spaces and capitals, so "M. M. Naushad Ali" and "M M Naushad Ali" match).
    var key = function (r) { return String(r[1] || "").toLowerCase().replace(/\./g, " ").replace(/\s+/g, " ").trim(); };
    var all = g.responses.filter(function (r) { return r[0] === semester; }), last = {};
    all.forEach(function (r, i) { if (key(r)) last[key(r)] = i; });
    var rows = all.filter(function (r, i) { return !key(r) || last[key(r)] === i; }), n = rows.length;
    var who = function (list) { var seen = {}, out = []; list.forEach(function (r) { if (r[1] && !seen[r[1]]) { seen[r[1]] = 1; out.push(r[1]); } }); return out; };
    var total = g.countBy === "id" ? who(rows).length : n;
    var blocks = g.items.map(function (it, k) {
      var v = function (r) { return r[2 + k]; };
      if (it.type === "list") {
        var count = {};
        rows.forEach(function (r) { if (v(r)) count[v(r)] = (count[v(r)] || 0) + 1; });
        return { kind: "one", label: it.label, text: Object.keys(count).sort().map(function (x) { return x + " (" + count[x] + ")"; }).join(", ") };
      }
      if (it.type === "hours") {
        var t = it.threshold, up = rows.filter(function (r) { return typeof v(r) === "number" && v(r) >= t; }).length,
            down = rows.filter(function (r) { return typeof v(r) === "number" && v(r) < t; }).length;
        return { kind: "cats", label: it.label, cats: [{ label: "≥ " + t, cls: "c-sa", codes: [csShare(up, n)] }, { label: "< " + t, cls: "c-sd", codes: [csShare(down, n)] }] };
      }
      if (it.type === "rating" || it.type === "agree") {
        return { kind: "cats", label: it.label, cats: CS_SCALE[it.type].map(function (c) {
          var hit = rows.filter(function (r) { return v(r) === c[0]; });
          return { label: c[1], cls: c[2], codes: it.type === "agree" ? who(hit) : [csShare(hit.length, n)] }; }) };
      }
      return { kind: "rec", label: it.label, lines: rows.filter(function (r) { return v(r); }).map(function (r) {
        return g.countBy === "id" ? v(r) : r[1] + ": " + v(r); }) };
    });

  }
  function renderCourseSurvey(d, params, key, group) {
    var sv = (d.surveys || []).filter(function (x) { return x.key === key; })[0], g = sv && sv[group];
    if (!g || !g.responses.length) { $("toolbar").innerHTML = ""; $("stage").innerHTML = '<div class="notice"><p>The data file has no ' + group + " feedback on " + key.toUpperCase().replace("EEE", "EEE ") + ".</p></div>"; return; }
    var view = "survey-" + key + "-" + group;
    var sems = uniqueSorted(g.responses.map(function (r) { return r[0]; })).sort(function (a, b) { return semRank(a) - semRank(b); });
    var sem = sems.indexOf(params.semester) >= 0 ? params.semester : sems[sems.length - 1];
    $("toolbar").innerHTML = selectField("selSem", "Semester", sems.map(function (x) { return { value: x, label: x }; }), sem) + PRINT_BTNS;
    $("selSem").onchange = function () { go(view, { semester: this.value }); };
    var r = computeCourseSurvey(g, sem), who = group === "student" ? "Student" : "Faculty";
    var title = who + " Feedback Summary Report (on " + sv.course + ")";
    $("stage").innerHTML = feedbackHtml(r, { title: title, col3: "Response Details",
      info: "<div><b>Semester:</b>" + esc(sem) + "</div><div><b>Responder Type:</b>" + esc(g.responder) + '</div><div><b>Total Number of Feedback:</b><span class="n">' + r.total + "</span></div>" });

  /* =====================================================================
     PO Loop: three reports from the PO Loop sheet
     ===================================================================== */
  // sheet row: [gradYear, batch, id, name, [course values], indirect, direct, total, status]
  var PO_MIN_COURSE_COLUMNS = 10;
  function pct0(v) { return typeof v === "number" ? Math.round(v + 1e-9) + "%" : ""; }
  function poList(d) { return Object.keys(d.sheets).sort(function (a, b) { return +a.slice(2) - +b.slice(2); }); }
  function poYears(d) {
    var seen = {};
    poList(d).forEach(function (p) { d.sheets[p].rows.forEach(function (r) { if (r[0] != null) seen[r[0]] = true; }); });
    return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
  }
  function poBatches(d, year) {
    var seen = {};
    poList(d).forEach(function (p) { d.sheets[p].rows.forEach(function (r) { if ((year === "All" || r[0] === year) && r[1] != null) seen[r[1]] = true; }); });
    return Object.keys(seen).map(Number).sort(function (a, b) { return batchRank(d, a) - batchRank(d, b); });
  }
  // Position of a batch in time. Up to 2024 the last digit is 1 Spring, 2 Summer, 3 Fall;
  // from the year in d.numberingFrom it is 1 Spring, 0 Summer, 2 Fall (251, 250, 252).
  function batchRank(d, batch) {
    var year = Math.floor(batch / 10), digit = batch % 10, from = d.numberingFrom == null ? 25 : d.numberingFrom;
    var term = year >= from ? ({ 1: 1, 0: 2, 2: 3 }[digit] || digit) : digit;
    return year * 10 + term;
  }
  // Thresholds go by batch: each rule [firstBatch, student %, cohort %] applies from its first batch
  // until the next rule starts. Batches before the first rule use the first rule.
  function poThreshold(d, batch, cohort) {
    var t = d.thresholds, pick = t[0];
    for (var i = 0; i < t.length; i++) if (batch != null && batchRank(d, batch) >= batchRank(d, t[i][0])) pick = t[i];
    return pick ? pick[cohort ? 2 : 1] : null;
  }
  function poStatus(d, r) {              // a student attains the PO at or above the threshold of his or her batch
    if (typeof r[7] !== "number") return "";
    var thr = poThreshold(d, r[1], false);
    return thr == null ? "" : (r[7] >= thr ? "Y" : "N");
  }
  // Cohort threshold of a group of students. A group that mixes batches with different
  // thresholds is judged against the highest of them.
  function cohortThreshold(d, rows) {
    var seen = {}, list = [];
    rows.forEach(function (r) { var v = poThreshold(d, r[1], true); if (v != null && !seen[v]) { seen[v] = true; list.push(v); } });
    list.sort(function (a, b) { return a - b; });
    return { value: list.length ? list[list.length - 1] : null, all: list };
  }
  function poTitle(d, po) { var s = d.statements[po] || po; var i = s.indexOf(":"); return i > 0 ? s.slice(0, i) : s; }
  function poDefaultYear(d, years) {
    var withLoop = years.filter(function (y) { return d.loops.some(function (l) { return l[0] === y; }); });
    return (withLoop.length ? withLoop : years)[(withLoop.length ? withLoop : years).length - 1];
  }
  function cohortShare(d, rows) {        // share of students with status Y among those with Y or N
    var y = 0, n = 0;
    rows.forEach(function (r) { var st = poStatus(d, r); if (st === "Y") y++; else if (st === "N") n++; });
    return y + n ? y / (y + n) : null;
  }

  // widthMm: the width the chart is printed at, so its labels come out at the body size (7pt).
  // labels (optional): full text for each axis; the chart is then drawn on a wide canvas.
  function radar(title, series, threshold, widthMm, labels, names, legendTop) {
    var W = labels ? 400 : 230, cx = W / 2, R = labels ? 78 : 70, cy = (title ? 118 : 100) + (labels || legendTop ? 22 : 0), n = names ? names.length : 12, s = "";
    var u = W / (widthMm || 56), FS = 2.47 * u, small = FS * 0.86;          // 7pt = 2.47mm
    var hasThr = typeof threshold === "number", legend = series.filter(function (x) { return x.label; });
    var top = !!labels || !!legendTop;                  // legend above the chart on the wide layout (and the PEO Loop Report)
    var H = cy + R + FS * 2.3 + (!top && (hasThr || legend.length) ? FS * 2 : 0) + (top ? FS * 0.6 : 0);
    var pt = function (i, v, extra) { var a = -Math.PI / 2 + i * 2 * Math.PI / n, r = R * v + (extra || 0); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    if (title) s += '<text x="' + cx + '" y="' + (FS * 1.5) + '" text-anchor="middle" font-weight="bold" font-size="' + FS.toFixed(1) + '">' + esc(title) + "</text>";
    [0.25, 0.5, 0.75, 1].forEach(function (v) { s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R * v + '" fill="none" stroke="#b7b7b7" stroke-width=".7"/>'; });
    for (var i = 0; i < n; i++) {
      var e = pt(i, 1), l = pt(i, 1, FS * 1.25);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="#d9d9d9" stroke-width=".6"/>';
      var a = -Math.PI / 2 + i * 2 * Math.PI / n, co = Math.cos(a), si = Math.sin(a);
      if (labels) {                                    // text grows away from the chart, so long labels never cross it
        var q = pt(i, 1, FS * 0.9), anchor = co > 0.2 ? "start" : co < -0.2 ? "end" : "middle";
        var dy = Math.abs(co) <= 0.2 ? (si < 0 ? -FS * 0.25 : FS * 0.95) : FS * 0.33 + si * FS * 0.35;
        s += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + dy).toFixed(1) + '" text-anchor="' + anchor + '" font-size="' + FS.toFixed(1) + '">' + esc(labels[i]) + "</text>";
      } else {
        s += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + FS * 0.33).toFixed(1) + '" text-anchor="middle" font-size="' + FS.toFixed(1) + '">' + esc(names ? names[i] : "PO" + (i + 1)) + "</text>";
      }
    }
    [0.5, 1].forEach(function (v) { s += '<text x="' + (cx + 2) + '" y="' + (cy - R * v + small * 0.95) + '" font-size="' + small.toFixed(1) + '" fill="#555">' + v * 100 + "%</text>"; });
    if (hasThr) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R * Math.min(1, threshold) + '" fill="none" stroke="#e0a800" stroke-width="1.3" stroke-dasharray="3.5 2.5"/>';
    series.forEach(function (ser) {
      var pts = ser.values.map(function (v, i) { return pt(i, typeof v === "number" ? Math.max(0, Math.min(1, v)) : 0); });
      s += '<polygon points="' + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '" fill="none" stroke="' + ser.color + '" stroke-width="' + (ser.thin ? 1 : 1.4) + '" stroke-linejoin="round"' + (ser.dash ? ' stroke-dasharray="' + ser.dash + '"' : "") + "/>";
      if (!ser.thin) pts.forEach(function (p) { s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="1.9" fill="' + ser.color + '"/>'; });
    });
    // legend, centred under the chart
    var items = legend.map(function (x) { return { label: x.label, color: x.color, dash: x.dash }; });
    if (hasThr) items.push({ label: "Threshold (" + Math.round(threshold * 1000) / 10 + "%)", color: "#e0a800", dash: "3.5 2.5" });
    var widths = items.map(function (it) { return 16 + it.label.length * FS * 0.46 + FS; }), total = widths.reduce(function (a, b) { return a + b; }, 0);

        '<text x="' + (x + 15) + '" y="' + (ly + FS * 0.33) + '" font-size="' + FS.toFixed(1) + '">' + esc(it.label) + "</text>";
      x += widths[k];
    });
    return '<svg viewBox="0 0 ' + W + " " + H.toFixed(1) + '" role="img" aria-label="' + esc(title || "Attainment") + ' by PO">' + s + "</svg>";
  }

  /* ---------- PO-wise Report ---------- */
  function computePoWise(d, po, year, batch) {

    var rows = sheet.rows.filter(function (r) { return (year === "All" || r[0] === year) && (batch === "All" || r[1] === batch); })
      .slice().sort(function (a, b) { return a[2] - b[2]; });
